[workspace]
authors = ["Joonhyung Shin <joons@uchicago.edu>"]
channels = ["conda-forge"]
name = "llm-context"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"

[pypi-dependencies]
numpy = ">=2.4.0,<3"
click = ">=8.3.1,<9"
wandb = ">=0.23.1,<0.24"

[feature.cuda]
platforms = ["linux-64"]
system-requirements = {cuda = "12.8"}

[feature.cuda.pypi-dependencies]
torch = { version = ">=2.9.1", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.24.1", index = "https://download.pytorch.org/whl/cu128" }

[feature.cpu.pypi-dependencies]
torch = ">=2.9.1"
torchvision = ">=0.24.1"

[feature.plot.pypi-dependencies]
matplotlib = ">=3.10.8"

[environments]
dsi-cuda = ["cuda"]
dsi-cpu = ["cpu", "plot"]
macos = ["cpu", "plot"]
